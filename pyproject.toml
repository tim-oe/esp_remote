[project]
name = "esp_remote"
version = "0.1.0"
description = "ESP32 web terminal to Raspberry Pi serial when the Pi is off-network"
authors = [
    {name = "tcronin", email = "tecronin@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "Adafruit-Blinka (>=9.0.0,<10.0.0)",
    "mpremote (>=1.28.0,<2.0.0)",
]

[tool.esp_remote.circuitpython]
dependencies = [
    "adafruit-circuitpython-httpserver (>=3.0.0,<4.0.0)",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[project.scripts]
lint = "scripts.lint:main"
format = "scripts.lint:format_code"
test = "scripts.test:main"
circup-install = "scripts.circup_install:main"
deploy = "scripts.deploy:main"
verify-terminal = "scripts.verify_terminal:main"

[tool.poetry]
packages = [
    {include = "esp_remote", from = "src"},
    {include = "scripts"},
]

[tool.poetry.group.dev.dependencies]
coverage = "^7.6"
pytest = "^9.0"
pytest-mock = "^3.14"
pylint = "^4.0"
black = "^26.3"
isort = "^8.0"
flake8 = "^7.1"
pytest-cov = "^7.1"
pytest-asyncio = "^1.3"
esptool = "^5.2"
circup = "^3.0"
mpremote = ">=1.24"
djlint = "^1.36"
adafruit-circuitpython-httpserver = "^4.8.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short -p no:debugging"

[tool.coverage.run]
source = ["src/esp_remote"]
omit = [
    "src/esp_remote/firmware/main.py",
    "src/esp_remote/firmware/wifi_setup.py",
    "src/esp_remote/firmware/uart_pi.py",
]
branch = true
data_file = "reports/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "except ImportError:",
]

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 88

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
