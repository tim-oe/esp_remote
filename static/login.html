<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>esp_remote — Sign in</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body class="login-page">
        <main class="card">
            <h1>esp_remote</h1>
            <p class="subtitle">Serial console to your Raspberry Pi (via ESP32)</p>
            <form method="post" action="/login">
                <label for="password">Password</label>
                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password"
                       required
                       autofocus />
                <button type="submit">Open terminal</button>
            </form>
        </main>
    </body>
</html>
